name: CI

on:
  push:
    branches: [main, audit-fixes]
  pull_request:

jobs:
  engine:
    name: engine (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install ruff mypy pytest
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      # pynput needs a display to import on Linux, and the X11 backend's check
      # opens a real window, so the suite runs under Xvfb: the backend is
      # exercised for real, not skipped. tk gives tkinter its library.
      - name: Self-checks (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb tk libportaudio2 > /dev/null
          xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest
      - name: Self-checks (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

  # The WPF window cannot be built anywhere but Windows, and nobody on the
  # Linux side can compile it by hand; this is where a C# slip gets caught.
  window:
    name: window (dotnet build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build ui-csharp -c Release -nologo
